name: Deploy BBVA CXAS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_CONVERSATION_MODE: cxas
          VITE_CXAS_DEPLOYMENT_NAME: projects/483471568825/locations/us/apps/0bf6c8a3-e782-49a8-a9e1-24c126f45e61/deployments/bc72b3db-9741-40be-b65a-45fc0d7f7e25
          VITE_ELEVENLABS_TTS_ENDPOINT: ${{ secrets.VITE_ELEVENLABS_TTS_ENDPOINT }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
